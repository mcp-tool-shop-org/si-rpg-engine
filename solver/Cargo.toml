[package]
name = "si-solver"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "abort"
overflow-checks = false

[dependencies]
rapier3d-f64 = { version = "0.35.3", features = ["enhanced-determinism"] }
