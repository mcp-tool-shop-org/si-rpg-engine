# Push is limited to main so a tag push cannot fire, and a feature branch
# leaves only the pull_request event. A branch with no open pull request
# gets no automatic run; workflow_dispatch is the fallback.
# The concurrency group is belt-and-braces and UNVERIFIED: once push is
# scoped to main, push and pull_request cannot name the same branch, so
# the group is never asked to collapse them.
name: CI

on:
  push:
    branches: [main]
    paths:
      - harness/**
      - fixtures/**
      - packages/**
      - predicates/**
      - worlds/**
      - atlas/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - solver/**
      - tools/**
      - .github/workflows/ci.yml
      # Codecov reads its status and comment settings from this file.
      - codecov.yml
  pull_request:
    paths:
      - harness/**
      - fixtures/**
      - packages/**
      - predicates/**
      - worlds/**
      - atlas/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - solver/**
      - tools/**
      - .github/workflows/ci.yml
      # Codecov reads its status and comment settings from this file.
      - codecov.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 'true' on a pull request or a push to the default branch, the runs
      # whose coverage and test results go to Codecov.
      COVERAGE_LEG: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      # A failing restore, outcome, course, trace, or golden check writes a
      # bundle here (harness/bundle.mjs); the last step uploads them on failure.
      - name: Where failures write bundles
        run: echo "SI_RPG_BUNDLES=$RUNNER_TEMP/bundles" >> "$GITHUB_ENV"
      # llvm-tools: the bench's law tests map the coverage build's counters to
      # lines with the pinned toolchain's llvm-profdata and llvm-cov (T7b pin 3).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver
      - name: Rebuild the solver and check its digest
        run: node solver/build.mjs --check
      # build.mjs already refuses to emit a binary the lint refuses; this step
      # names the lint's verdict on the pinned Linux bytes in the log.
      - name: Lint the pinned binary
        run: node solver/lint.mjs
      # The law's native tests: the canon_quat cases, the reload decisions S1
      # pins, and T4's CCD evidence. They sit at the end of the law's source,
      # so the release wasm is unchanged by them. Release only: Rapier's
      # island-manager debug_assert fires when bodies touch at load.
      - name: Run the law's native tests
        working-directory: solver
        run: cargo test --release --locked
      - name: Check the kernel contract
        run: npm run typecheck
      # The course and the outcome tests say what happened, by name. They run
      # before any golden compare, so a broken outcome is reported as itself
      # and not as a hash mismatch. npm test runs them again with the rest.
      - name: Run the character course and the outcome tests
        id: tests
        run: node --test harness/course.test.js harness/outcome.test.js
        # On the coverage leg every Node process the tests start leaves raw V8
        # coverage outside the tree, and the test runner also writes JUnit to
        # junit.xml where it runs; elsewhere both variables are empty, which
        # Node reads as unset.
        env:
          NODE_OPTIONS: ${{ env.COVERAGE_LEG == 'true' && '--test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml' || '' }}
          NODE_V8_COVERAGE: ${{ env.COVERAGE_LEG == 'true' && format('{0}/v8-coverage', runner.temp) || '' }}
      # One lcov report from the raw coverage every Node process of the
      # tests left. The exact version keeps npx from fetching whichever c8
      # is newest on the day.
      - name: Coverage report for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        run: npx --yes c8@12.0.0 report --temp-directory "$RUNNER_TEMP/v8-coverage" --reporter=lcov --reporter=text-summary --report-dir coverage/c8
      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage/c8/lcov.info
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: junit.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      # The engines compare before the node suite, so a golden mismatch is
      # named by the compare step even when a node test also reads the golden.
      - name: Install pinned engines
        run: |
          set -euo pipefail
          npm install -g jsvu@3.0.5
          jsvu --os=linux64 v8@15.6.61
          jsvu --os=linux64 spidermonkey@156.0.1
          jsvu --os=linux64 javascriptcore@319571
      - name: Compare each engine to the golden hash
        run: |
          set -euo pipefail
          traces="$RUNNER_TEMP/traces"
          # On a mismatch: trace the product scene under node and under the
          # engine, and print the first quantum, body, and field that differ.
          first_difference() {
            local name="$1"
            shift
            mkdir -p "$traces"
            if [ ! -f "$traces/node.trace" ]; then
              node harness/trace.mjs > "$traces/node.trace" || true
            fi
            "$@" harness/trace.mjs > "$traces/$name.trace" || true
            echo "first-difference node $name"
            node harness/first-difference.js "$traces/node.trace" "$traces/$name.trace" || true
            # A bundle carrying the engine's hashes: `replay` on it under
            # node names the first tick where node and the engine part.
            node harness/bundle.mjs --from-trace "$traces/$name.trace" --name "product scene under $name" || true
          }
          compare() {
            local harness="$1"
            local golden_file="$2"
            local golden
            golden=$(tr -d '\r\n' < "$golden_file")
            local v8 sm jsc
            v8=$("$HOME/.jsvu/bin/v8-15.6.61" --module "$harness" | tr -d '\r\n')
            sm=$("$HOME/.jsvu/bin/spidermonkey-156.0.1" -m "$harness" | tr -d '\r\n')
            jsc=$("$HOME/.jsvu/bin/javascriptcore-319571" -m "$harness" | tr -d '\r\n')
            if [ "$v8" != "$golden" ] || [ "$sm" != "$golden" ] || [ "$jsc" != "$golden" ]; then
              echo "$harness"
              echo "v8 [$v8]"
              echo "spidermonkey [$sm]"
              echo "javascriptcore [$jsc]"
              echo "golden [$golden]"
              if [ "$harness" = "harness/sim.mjs" ]; then
                if [ "$v8" != "$golden" ]; then
                  first_difference v8 "$HOME/.jsvu/bin/v8-15.6.61" --module
                fi
                if [ "$sm" != "$golden" ]; then
                  first_difference spidermonkey "$HOME/.jsvu/bin/spidermonkey-156.0.1" -m
                fi
                if [ "$jsc" != "$golden" ]; then
                  first_difference javascriptcore "$HOME/.jsvu/bin/javascriptcore-319571" -m
                fi
              fi
              exit 1
            fi
            echo "$harness three engines match $golden"
          }
          compare harness/sim.mjs fixtures/golden.txt
          compare harness/arith.mjs fixtures/golden-arith.txt
      - name: Trace the product scene under every engine
        run: |
          set -euo pipefail
          traces="$RUNNER_TEMP/traces"
          mkdir -p "$traces"
          node harness/trace.mjs > "$traces/node.trace"
          "$HOME/.jsvu/bin/v8-15.6.61" --module harness/trace.mjs > "$traces/v8.trace"
          "$HOME/.jsvu/bin/spidermonkey-156.0.1" -m harness/trace.mjs > "$traces/spidermonkey.trace"
          "$HOME/.jsvu/bin/javascriptcore-319571" -m harness/trace.mjs > "$traces/javascriptcore.trace"
          for engine in v8 spidermonkey javascriptcore; do
            if out=$(node harness/first-difference.js "$traces/node.trace" "$traces/$engine.trace"); then
              echo "node $engine $out"
            else
              echo "node $engine"
              echo "$out"
              exit 1
            fi
          done
      - name: Run the kernel fixture
        run: npm test
      - name: Check the golden behaviour numbers
        run: npm run check
      - name: Check the Atlas map
        run: npx --yes @dogfood-lab/atlas@1.17.0 check
      # The ARM lane tests these bytes, not a rebuild: the module that embeds
      # the pinned Linux binary, and node's x64 trace of the product scene.
      - name: Collect the x64 artifacts for the ARM lane
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/x64"
          cp solver/dist/solver.mjs "$RUNNER_TEMP/x64/solver.mjs"
          cp "$RUNNER_TEMP/traces/node.trace" "$RUNNER_TEMP/x64/node.trace"
      - name: Upload the x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x64
          path: ${{ runner.temp }}/x64/
          if-no-files-found: error
          retention-days: 14
      - name: Upload the traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces
          path: ${{ runner.temp }}/traces/
          if-no-files-found: ignore
          retention-days: 14
      # Each bundle replays in one command: `replay <name>.bundle.json`.
      - name: Upload the failure bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: ${{ runner.temp }}/bundles/
          if-no-files-found: ignore
          retention-days: 14

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: engines
    if: ${{ !cancelled() && needs.engines.result != 'cancelled' && needs.engines.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: coverage/c8
      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .
      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.engines.result == 'success' || hashFiles('coverage/c8/lcov.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage/c8/lcov.info
      - name: Upload test results to Codecov
        if: ${{ needs.engines.result == 'success' || hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./junit.xml

  # The second architecture. jsvu publishes no ARM builds of the three shells,
  # so this lane runs node's V8 on ARM64, which is the architecture drift it
  # exists to catch. It does not rebuild the solver: it runs the x64 job's
  # module, checks that its bytes are the pinned digest, and requires both
  # goldens and a trace identical to the x64 trace. The workflow's concurrency
  # group covers this job.
  arm:
    needs: engines
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: x64
          path: ${{ runner.temp }}/x64
      - name: Install the x64 solver module and check its bytes
        run: |
          set -euo pipefail
          uname -m
          mkdir -p solver/dist
          cp "$RUNNER_TEMP/x64/solver.mjs" solver/dist/solver.mjs
          node --input-type=module -e "
            import { createHash } from 'node:crypto';
            import { readFileSync, writeFileSync } from 'node:fs';
            import { bytes } from './solver/dist/solver.mjs';
            const digest = createHash('sha256').update(bytes).digest('hex');
            const pinned = readFileSync('fixtures/solver.sha256', 'utf8').trim();
            if (digest !== pinned) {
              console.error('the x64 module embeds ' + digest + ', not the pinned ' + pinned);
              process.exit(1);
            }
            writeFileSync(process.env.RUNNER_TEMP + '/si_solver.wasm', bytes);
            console.log('the module embeds the pinned binary ' + digest);
          "
          node solver/lint.mjs "$RUNNER_TEMP/si_solver.wasm"
      - name: Compare node on ARM64 to the golden hashes
        run: |
          set -euo pipefail
          for pair in "harness/sim.mjs fixtures/golden.txt" "harness/arith.mjs fixtures/golden-arith.txt"; do
            set -- $pair
            golden=$(tr -d '\r\n' < "$2")
            got=$(node "$1" | tr -d '\r\n')
            if [ "$got" != "$golden" ]; then
              echo "$1 node arm64 [$got] golden [$golden]"
              exit 1
            fi
            echo "$1 node arm64 matches $golden"
          done
      - name: Trace the product scene and diff it against the x64 trace
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/traces"
          node harness/trace.mjs > "$RUNNER_TEMP/traces/arm64.trace"
          if out=$(node harness/first-difference.js "$RUNNER_TEMP/x64/node.trace" "$RUNNER_TEMP/traces/arm64.trace"); then
            echo "x64 arm64 $out"
          else
            echo "x64 arm64"
            echo "$out"
            exit 1
          fi
      - name: Upload the ARM trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-arm64
          path: ${{ runner.temp }}/traces/
          if-no-files-found: ignore
          retention-days: 14
