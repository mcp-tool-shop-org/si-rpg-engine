# Push is limited to main so a tag push cannot fire, and a feature branch
# leaves only the pull_request event. A branch with no open pull request
# gets no automatic run; workflow_dispatch is the fallback.
# The concurrency group is belt-and-braces and UNVERIFIED: once push is
# scoped to main, push and pull_request cannot name the same branch, so
# the group is never asked to collapse them.
name: CI

on:
  push:
    branches: [main]
    paths:
      - harness/**
      - fixtures/**
      - packages/**
      - predicates/**
      - worlds/**
      - atlas/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - solver/**
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - harness/**
      - fixtures/**
      - packages/**
      - predicates/**
      - worlds/**
      - atlas/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - solver/**
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver
      - name: Rebuild the solver and check its digest
        run: node solver/build.mjs --check
      - name: Check the kernel contract
        run: npm run typecheck
      # The engines compare before the node suite, so a golden mismatch is
      # named by the compare step even when a node test also reads the golden.
      - name: Install pinned engines
        run: |
          set -euo pipefail
          npm install -g jsvu@3.0.5
          jsvu --os=linux64 v8@15.6.61
          jsvu --os=linux64 spidermonkey@156.0.1
          jsvu --os=linux64 javascriptcore@319571
      - name: Compare each engine to the golden hash
        run: |
          set -euo pipefail
          traces="$RUNNER_TEMP/traces"
          # On a mismatch: trace the product scene under node and under the
          # engine, and print the first quantum, body, and field that differ.
          first_difference() {
            local name="$1"
            shift
            mkdir -p "$traces"
            if [ ! -f "$traces/node.trace" ]; then
              node harness/trace.mjs > "$traces/node.trace" || true
            fi
            "$@" harness/trace.mjs > "$traces/$name.trace" || true
            echo "first-difference node $name"
            node harness/first-difference.js "$traces/node.trace" "$traces/$name.trace" || true
          }
          compare() {
            local harness="$1"
            local golden_file="$2"
            local golden
            golden=$(tr -d '\r\n' < "$golden_file")
            local v8 sm jsc
            v8=$("$HOME/.jsvu/bin/v8-15.6.61" --module "$harness" | tr -d '\r\n')
            sm=$("$HOME/.jsvu/bin/spidermonkey-156.0.1" -m "$harness" | tr -d '\r\n')
            jsc=$("$HOME/.jsvu/bin/javascriptcore-319571" -m "$harness" | tr -d '\r\n')
            if [ "$v8" != "$golden" ] || [ "$sm" != "$golden" ] || [ "$jsc" != "$golden" ]; then
              echo "$harness"
              echo "v8 [$v8]"
              echo "spidermonkey [$sm]"
              echo "javascriptcore [$jsc]"
              echo "golden [$golden]"
              if [ "$harness" = "harness/sim.mjs" ]; then
                if [ "$v8" != "$golden" ]; then
                  first_difference v8 "$HOME/.jsvu/bin/v8-15.6.61" --module
                fi
                if [ "$sm" != "$golden" ]; then
                  first_difference spidermonkey "$HOME/.jsvu/bin/spidermonkey-156.0.1" -m
                fi
                if [ "$jsc" != "$golden" ]; then
                  first_difference javascriptcore "$HOME/.jsvu/bin/javascriptcore-319571" -m
                fi
              fi
              exit 1
            fi
            echo "$harness three engines match $golden"
          }
          compare harness/sim.mjs fixtures/golden.txt
          compare harness/arith.mjs fixtures/golden-arith.txt
      - name: Trace the product scene under every engine
        run: |
          set -euo pipefail
          traces="$RUNNER_TEMP/traces"
          mkdir -p "$traces"
          node harness/trace.mjs > "$traces/node.trace"
          "$HOME/.jsvu/bin/v8-15.6.61" --module harness/trace.mjs > "$traces/v8.trace"
          "$HOME/.jsvu/bin/spidermonkey-156.0.1" -m harness/trace.mjs > "$traces/spidermonkey.trace"
          "$HOME/.jsvu/bin/javascriptcore-319571" -m harness/trace.mjs > "$traces/javascriptcore.trace"
          for engine in v8 spidermonkey javascriptcore; do
            if out=$(node harness/first-difference.js "$traces/node.trace" "$traces/$engine.trace"); then
              echo "node $engine $out"
            else
              echo "node $engine"
              echo "$out"
              exit 1
            fi
          done
      - name: Run the kernel fixture
        run: npm test
      - name: Check the golden behaviour numbers
        run: npm run check
      - name: Check the Atlas map
        run: npx --yes @dogfood-lab/atlas@1.17.0 check
      - name: Upload the traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces
          path: ${{ runner.temp }}/traces/
          if-no-files-found: ignore
          retention-days: 14
