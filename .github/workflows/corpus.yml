# The corpus, T5 pins 4 and 5 (docs/dispatch-t5-replay-corpus.md), and the
# reachability sweep, T6 pin 10 (docs/dispatch-t6-reachability-sweep.md).
#
# Why a schedule: replaying every bundle in fixtures/corpus/, every behaviour
# fixture and log, and the product scene for 100,000 quanta with ten image
# restores does not fit the pull-request job's budget, and neither does
# sweeping every world in worlds/index.json, every fixture world on the
# product law, and the product scene, each under a budget of 1,500,000 quanta
# and 15,000 restores (SWEEP_BUDGET in harness/corpus.mjs; it cuts short the
# product scene and the minds fixture, and every other world finishes inside
# it); and the runner image drifts week to week under the pinned toolchain,
# which no push can detect. The job replays,
# sweeps, and reports. It never pushes, never opens a pull request, and never
# edits a golden or the sweep's record. On failure it opens one issue titled
# with the first failing bundle and its first-difference block, with the
# bundles attached as this run's `bundles` artifact. A sweep fails when its
# verdict differs from fixtures/sweep/verdicts.json in either direction (a new
# finding or a finding gone, a zone reached or lost, a sweep that no longer
# finishes), and writes the bundles of its findings; the worlds the record
# holds refused are findings already named for the coordinator, so they do
# not open an issue every week. A bundle's hashes are the law's,
# so every bundle replays on any binary; its stored image is one binary's
# bytes, used on that binary and otherwise skipped for a fresh image taken at
# its save tick, and the run prints how many were used and skipped. Every run
# also uploads `fresh-corpus`, the corpus's own bundles written by this build:
# a slice that changes the law, or fixes a bundled defect, commits those in
# place of the old ones; a slice that only moves the binary need not.
#
# Standards compliance (0 missing, 1 partial, 2 present, 3 exemplary):
# - PIN_PER_STEP 2: node 22, Rust 1.98.1, the solver's Linux digest (build --check refuses any other before a bundle replays or a world is swept), the actions by major tag, and the sweep's budget and its record of verdicts, both committed; ubuntu-latest cannot be pinned by digest, so the job prints ImageOS and ImageVersion, the drift it exists to catch. Remediation still open: pin the actions by commit SHA, owner coordinator; T6 did not take it, since its dispatch does not name it.
# - ANDON_AUTHORITY 3: any failing bundle, fixture, capture, restore point, or sweep verdict fails the job and opens an issue, and every failure writes a bundle; the replay step has its own timeout inside the job's, so a run over budget fails that step and the issue still opens (a job timeout cancels, and skips failure() steps); build --check halts on a moved digest first; harness/bundle.test.js proves a planted failure goes red and its bundle reproduces it, and harness/sweep.test.js that a record planted with a moved verdict goes red with the findings bundled.
# - NAMED_COMPENSATORS 2: its one irreversible action, opening an issue, has the undo and owner in the table below; it never pushes, so nothing else needs undoing.
# - DECOMPOSE_BY_SECRETS 2: the bundle format and its replay are packages/tick/bundle.js, which the replay command shares; where failures write and the test hooks are harness/bundle.mjs; the sweep is packages/load/sweep.js, which load world shares; what the corpus replays and sweeps, and the comparison with the record, are harness/corpus.mjs; the record is fixtures/sweep/verdicts.json; the schedule and the issue are this file; the engine is not touched.
# - UNCERTAINTY_GATED_HUMANS 2: a green run asks no one; a red run is the uncertainty a person decides (fix the engine or the content, or rewrite a bundle or the record with node harness/corpus.mjs --record-sweep and say why), so it opens an issue for the coordinator.
# - EXTERNAL_VERIFIER 2: the verdict is the hash chain and the first-difference comparison (packages/tick/difference.js, which harness/first-difference.js and the replay command share) and, for the sweep, the checker's admissions with every witness replayable by the replay command, never a model; the slice that wrote this is reviewed by another model family before merge.
#
# Compensators:
# | action                        | undo                                                         | state after the undo                                   | owner       |
# |-------------------------------|--------------------------------------------------------------|--------------------------------------------------------|-------------|
# | gh issue create (on failure)  | gh issue close <number> --reason "not planned" --comment why | the issue closed; the run and its artifacts kept 14 days | coordinator |
#
# Weekly, Monday 06:17 UTC, and by hand. It is not push-triggered: the
# repository's two push-triggered workflows stay ci.yml and pages.yml.
name: Corpus

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver
      - name: Rebuild the solver and check its digest
        run: node solver/build.mjs --check
      # The step's own budget, inside the job's 30 minutes: setup takes about a
      # minute and the steps after this one under a minute. Past 25 minutes
      # this step fails, and the failure() steps below still upload the bundles
      # and open the issue; a job timeout would cancel the job and skip them.
      # The log is kept so an issue for a run that did not finish shows how far
      # it got. The replay took about 3 minutes before T6, and the sweep adds
      # about 12: six and a half minutes on the builder's machine, which runs
      # a quantum 1.8 times as fast as CI (SWEEP_BUDGET in harness/corpus.mjs).
      - name: Replay the corpus and sweep the worlds
        timeout-minutes: 25
        run: |
          set -euo pipefail
          echo "runner image $ImageOS $ImageVersion"
          mkdir -p "$RUNNER_TEMP/bundles"
          SI_RPG_BUNDLES="$RUNNER_TEMP/bundles" node harness/corpus.mjs --summary "$RUNNER_TEMP/issue.md" --title "$RUNNER_TEMP/issue-title.txt" 2>&1 | tee "$RUNNER_TEMP/corpus.log"
      - name: Write the corpus's own bundles from this build
        if: ${{ !cancelled() }}
        run: node harness/corpus.mjs --write "$RUNNER_TEMP/fresh-corpus"
      - name: Upload the fresh corpus
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fresh-corpus
          path: ${{ runner.temp }}/fresh-corpus/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the failing bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: ${{ runner.temp }}/bundles/
          if-no-files-found: ignore
          retention-days: 14
      # The one irreversible action; its compensator is in the table above.
      - name: Open one issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/issue-body.md"
          if [ -s "$RUNNER_TEMP/issue-title.txt" ]; then
            title=$(head -n 1 "$RUNNER_TEMP/issue-title.txt")
            cat "$RUNNER_TEMP/issue.md" > "$body"
          else
            # No summary: the corpus did not finish. It failed before its end,
            # or ran past the replay step's 25 minutes.
            title="corpus: did not finish, failed or over its 25-minute budget (${GITHUB_REF_NAME})"
            {
              echo "The corpus did not finish: it failed before writing its summary, or ran past the replay step's 25-minute budget. The last lines it printed:"
              echo
              echo '```'
              tail -n 40 "$RUNNER_TEMP/corpus.log" 2>/dev/null || echo "(no log: it stopped before the replay step)"
              echo '```'
            } > "$body"
          fi
          {
            echo
            echo "Run: $RUN_URL on \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`, runner image $ImageOS $ImageVersion."
            echo "The failing bundles are the run's \`bundles\` artifact; each replays in one command: \`replay <name>.bundle.json\`."
          } >> "$body"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
