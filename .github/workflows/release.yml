# Publishes @si-rpg-engine/frame, tick, host, and load. The root package stays
# private. The trusted publisher names this file release.yml.
# A full release points latest at the version with npm dist-tag. A prerelease
# stays on next. Dist-tag needs the publisher permission Allow npm dist-tag
# and npm 11.21.0 or newer. The modules import siblings and the solver by
# relative path, so the job publishes the staged tree from tools/stage-release.mjs
# rather than the workspace directory alone.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack only. Do not publish or move a dist-tag.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install pinned npm for OIDC dist-tags
        run: npm install -g npm@11.21.0 --ignore-scripts

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver

      - name: Build the solver and hold the pin
        run: node solver/build.mjs --check

      - name: Stage the packages
        run: node tools/stage-release.mjs

      - name: Publish
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'true' || 'false' }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease == true && 'true' || 'false' }}
        run: bash tools/publish-release.sh
