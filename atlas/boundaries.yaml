summary: "Deterministic 3D RPG tick: the model proposes, a checker admits, and the host draws committed frames."
boundaries:
  - name: solver
    globs: [solver/**]
    role: code
  - name: tick
    globs: [packages/tick/**]
    role: code
  - name: frame
    globs: [packages/frame/**]
    role: code
  - name: harness
    globs: [harness/**]
    role: test
  - name: load
    globs: [packages/load/**]
    role: code
  - name: propose
    globs: [packages/propose/**]
    role: code
  - name: host
    globs: [packages/host/**]
    role: code
  - name: intents
    globs: [predicates/intents/**]
    role: data
  - name: hazards
    globs: [predicates/hazards/**]
    role: data
  - name: fixtures
    globs: [fixtures/**]
    role: data
  - name: worlds
    globs: [worlds/**]
    role: data
  - name: docs
    globs: [docs/**]
    role: docs
  - name: workflows
    globs: [.github/**]
    role: config
  - name: root
    globs: ["*"]
    role: docs
