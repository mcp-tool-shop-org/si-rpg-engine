summary: "Deterministic 3D RPG tick: the model proposes, a checker admits, and the host draws committed frames."
boundaries:
  - name: tick
    globs: [packages/tick/**]
    role: code
  - name: frame
    globs: [packages/frame/**]
    role: code
  - name: harness
    globs: [harness/**]
    role: test
  - name: intents
    globs: [predicates/intents/**]
    role: data
  - name: fixtures
    globs: [fixtures/**]
    role: data
  - name: docs
    globs: [docs/**]
    role: docs
  - name: workflows
    globs: [.github/**]
    role: config
  - name: root
    globs: ["*"]
    role: docs
