<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>si-rpg-engine debug view</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14181c; color: #e7e1d5; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 10px 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; }
    header p { margin: 0; max-width: 100%; }
    #status { word-break: break-all; }
    #projection, #reason, #door { min-height: 1.2em; margin: 0 14px; }
    #reason { color: #e0a15a; }
    #door { color: #e7e1d5; }
    #stage { flex: 1 1 auto; min-width: 0; min-height: 0; position: relative; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <header>
    <p><strong>Debug view of the tick.</strong> Boxes are the committed state, nothing more. Left and right move on the ground. P pushes the nearest body. Click a ground point. x, y, and z choose the axis looked along.</p>
    <p id="status">connecting</p>
  </header>
  <p id="projection">projection: x-y, looking along z</p>
  <p id="reason"></p>
  <p id="door"></p>
  <div id="stage"><canvas id="room"></canvas></div>
  <script type="module">
    import { fit, worldToCanvas, canvasToWorld, blendBody, projectionAxes, projectedSpan, groundTarget } from '/view.js';

    const canvas = document.getElementById('room');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const projection = document.getElementById('projection');
    const reason = document.getElementById('reason');
    const door = document.getElementById('door');
    let world = null;
    let previous = null;
    let newest = null;
    let arrived = 0;
    let along = 'z';

    function showProjection() {
      projection.textContent = 'projection: ' + projectionAxes(along).label;
    }

    function resize() {
      const ratio = window.devicePixelRatio || 1;
      const w = Math.max(1, Math.floor(canvas.clientWidth * ratio));
      const h = Math.max(1, Math.floor(canvas.clientHeight * ratio));
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
      }
    }

    function rect(view, h0, v0, h1, v1, fill) {
      const a = worldToCanvas(view, h0, v0);
      const b = worldToCanvas(view, h1, v1);
      ctx.fillStyle = fill;
      ctx.fillRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
    }

    function viewOf() {
      if (!world || world.colliders.length === 0) {
        return fit(canvas.width, canvas.height);
      }
      let minH = Infinity;
      let maxH = -Infinity;
      let minV = Infinity;
      let maxV = -Infinity;
      for (const box of world.colliders) {
        const span = projectedSpan(along, box, false);
        minH = Math.min(minH, span.h0);
        maxH = Math.max(maxH, span.h1);
        minV = Math.min(minV, span.v0);
        maxV = Math.max(maxV, span.v1);
      }
      if (world.goal) {
        const span = projectedSpan(along, world.goal, false);
        minH = Math.min(minH, span.h0);
        maxH = Math.max(maxH, span.h1);
        minV = Math.min(minV, span.v0);
        maxV = Math.max(maxV, span.v1);
      }
      return fit(canvas.width, canvas.height, { minH, maxH, minV, maxV });
    }

    function draw() {
      resize();
      const view = viewOf();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#1c242b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (world) {
        for (const box of world.colliders) {
          const fill = box.id === 'floor' ? '#3d4a43' : '#3e4d63';
          const span = projectedSpan(along, box, false);
          rect(view, span.h0, span.v0, span.h1, span.v1, fill);
        }
        if (world.goal) {
          const span = projectedSpan(along, world.goal, false);
          rect(view, span.h0, span.v0, span.h1, span.v1, 'rgba(224, 161, 90, 0.45)');
        }
      }
      if (newest) {
        const alpha = world ? Math.min(1, (performance.now() - arrived) / (world.dt * 1000)) : 1;
        for (const body of newest.bodies) {
          const prev = previous ? previous.bodies.find((item) => item.id === body.id) : null;
          const at = blendBody(prev || null, body, alpha, world ? world.dt : 1);
          const color = body.id === 'walker' ? '#e7e1d5' : '#8fb9a8';
          const span = projectedSpan(along, {
            x: at.x, y: at.y, z: at.z,
            hx: body.hx, hy: body.hy, hz: body.hz,
          }, true);
          rect(view, span.h0, span.v0, span.h1, span.v1, color);
        }
        status.textContent = 'tick ' + newest.tick + '  ' + newest.hash;
        if (newest.door !== null && newest.door !== undefined && door.textContent === '') {
          door.textContent = 'door reached at tick ' + newest.door;
        }
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    async function send(body) {
      const response = await fetch('/intent', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      });
      const result = await response.json();
      reason.textContent = result.admitted ? '' : result.reason;
    }

    function walker() {
      if (!newest) {
        return null;
      }
      return newest.bodies.find((body) => body.id === 'walker') || newest.bodies[0];
    }

    canvas.addEventListener('pointerdown', (event) => {
      const actor = walker();
      if (!actor) {
        return;
      }
      const rectBox = canvas.getBoundingClientRect();
      const ratio = canvas.width / rectBox.width;
      const view = viewOf();
      const point = canvasToWorld(view, (event.clientX - rectBox.left) * ratio, (event.clientY - rectBox.top) * ratio);
      send({ verb: 'move', actor: 'walker', target: groundTarget(along, point.x, point.y, actor) });
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'x' || event.key === 'y' || event.key === 'z') {
        event.preventDefault();
        along = event.key;
        showProjection();
        return;
      }
      if (event.key === 'p' || event.key === 'P') {
        event.preventDefault();
        send({ verb: 'push', actor: 'walker' });
        return;
      }
      const directions = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' };
      const direction = directions[event.key];
      if (!direction) {
        return;
      }
      event.preventDefault();
      const axes = projectionAxes(along);
      const actor = walker();
      const horizontal = direction === 'left' || direction === 'right';
      const axis = horizontal ? axes.horizontal : axes.vertical;
      if (!actor || axis === 'y') {
        send({ verb: 'move', actor: 'walker', direction: horizontal ? direction : (direction === 'up' ? 'up' : 'down') });
        return;
      }
      const sign = direction === 'left' || direction === 'down' ? -1 : 1;
      const target = { x: actor.x, z: actor.z };
      target[axis] = actor[axis] + sign;
      send({ verb: 'move', actor: 'walker', target });
    });

    const response = await fetch('/frames');
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const chunk = await reader.read();
      if (chunk.done) {
        break;
      }
      buffer += decoder.decode(chunk.value, { stream: true });
      let nl = buffer.indexOf('\n');
      while (nl >= 0) {
        const line = buffer.slice(0, nl);
        buffer = buffer.slice(nl + 1);
        if (line) {
          const record = JSON.parse(line);
          if (record.kind === 'world') {
            world = record;
          } else if (record.kind === 'frame') {
            previous = newest;
            newest = record;
            arrived = performance.now();
          }
        }
        nl = buffer.indexOf('\n');
      }
    }
  </script>
</body>
</html>
